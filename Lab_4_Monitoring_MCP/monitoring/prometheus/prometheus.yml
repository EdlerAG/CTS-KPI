global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "coordinator"
    static_configs:
      - targets: ["coordinator:8000"]

  - job_name: "shards"
    static_configs:
      - targets:
          - "shard-1-leader:8001"
          - "shard-1-follower-1:8001"
          - "shard-1-follower-2:8001"
          - "shard-2-leader:8001"
          - "shard-2-follower-1:8001"
          - "shard-2-follower-2:8001"
          - "shard-3-leader:8001"
          - "shard-3-follower-1:8001"
          - "shard-3-follower-2:8001"
